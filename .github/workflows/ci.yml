name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke run with mock agents
        run: |
          aic --config examples/offline-demo.toml --no-color chat captain robot --topic "hello" --rounds 2
          aic --config examples/offline-demo.toml --no-color relay captain robot narrator --prompt "a storm is coming"
